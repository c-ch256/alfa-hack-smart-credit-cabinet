services:
  db:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_DB: ${DB_NAME:-credit_cabinet}
      POSTGRES_USER: ${DB_USER:-credit_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-credit_cabinet}
      DB_USER: ${DB_USER:-credit_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_ISSUER: ${JWT_ISSUER:-craftors-credit-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-craftors-credit-cabinet}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-60}
      KEY_RATE: ${KEY_RATE:-16.00}
      SCORER: ${SCORER:-mock}
      MODEL_DIR: ${MODEL_DIR:-/app/ml/artifacts}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:8000:8000'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2)']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres_data:
