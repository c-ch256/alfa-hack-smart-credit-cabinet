server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Strip /api, just as the Vite development proxy does.
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        # The public host may be the jury computer's LAN address. Keep the
        # upstream Host compatible with the backend's existing TrustedHost rules.
        proxy_set_header Host localhost;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http://localhost/ /api/;
        proxy_redirect http://api:8000/ /api/;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
